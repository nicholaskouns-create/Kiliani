name: Deploy website

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "tools/check_boundaries.py"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "docs/**"
      - "tools/check_boundaries.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate the site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: The boundaries must still hold
        run: python3 tools/check_boundaries.py

      - name: Every relative link in docs/ must resolve
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          for page in docs/*.html; do
            # Relative hrefs and srcs only: skip anchors, absolute URLs and mailto,
            # and skip JS template literals and string concatenation, which the
            # witness browser builds its links from at runtime.
            targets="$(grep -oE '(href|src)="[^"]+"' "$page" \
              | sed -E 's/^(href|src)="//; s/"$//' \
              | grep -vE '^(#|https?:|mailto:|data:)' \
              | grep -vF '${' | grep -vF "'+" | grep -vF '"+' || true)"
            for t in $targets; do
              clean="${t%%#*}"; clean="${clean%%\?*}"
              [ -z "$clean" ] && continue
              if [ "$clean" = "./" ]; then clean="index.html"; fi
              case "$clean" in */) clean="${clean}index.html";; esac
              if [ ! -e "docs/$clean" ]; then
                echo "::error file=$page::relative link does not resolve: $t"
                fail=1
              fi
            done
          done
          [ "$fail" -eq 0 ] && echo "All relative links in docs/ resolve."
          exit "$fail"

      - name: The data files the pages read must parse
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, xml.etree.ElementTree as ET
          for p in sorted(pathlib.Path("docs/data").glob("*.json")):
              json.loads(p.read_text(encoding="utf-8")); print(f"ok  {p}")
          for p in sorted(pathlib.Path("docs/data").glob("*.xml")):
              ET.parse(p); print(f"ok  {p}")
          PY

      - name: The citation must match CITATION.cff
        shell: bash
        run: |
          set -euo pipefail
          for token in "Kouns" "Killion-Kouns family archive" "CC-BY-4.0"; do
            grep -q -- "$token" CITATION.cff || { echo "::error::CITATION.cff lost: $token"; exit 1; }
          done
          grep -q "Killion–Kouns family archive" docs/index.html \
            || { echo "::error::the front page no longer carries the dataset title"; exit 1; }
          grep -q "Do not cite it for" docs/index.html \
            || { echo "::error::the front page no longer carries the do-not-cite caveat"; exit 1; }
          echo "Citation block agrees with CITATION.cff."

  publish:
    name: Publish docs to gh-pages
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build the gh-pages branch from docs/
        shell: bash
        run: |
          set -euo pipefail

          site_dir="$(mktemp -d)"
          cp -a docs/. "$site_dir/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          publish_dir="$(mktemp -d)"
          # First publish has no gh-pages branch yet; start from an empty tree then.
          if git fetch origin gh-pages 2>/dev/null; then
            git worktree add --detach "$publish_dir" FETCH_HEAD
            git -C "$publish_dir" rm -rf --ignore-unmatch . >/dev/null
          else
            echo "No gh-pages branch yet; creating it."
            git worktree add --detach --no-checkout "$publish_dir" HEAD
            git -C "$publish_dir" checkout --orphan gh-pages
            git -C "$publish_dir" rm -rf --cached . >/dev/null 2>&1 || true
            find "$publish_dir" -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          fi

          cp -a "$site_dir/." "$publish_dir/"
          touch "$publish_dir/.nojekyll"
          git -C "$publish_dir" add -A
          if git -C "$publish_dir" diff --cached --quiet; then
            echo "Published files already match this source."
          else
            git -C "$publish_dir" commit -m "Deploy site from ${GITHUB_SHA}"
            git -C "$publish_dir" push origin HEAD:refs/heads/gh-pages
          fi

      - name: Verify the live Pages document
        shell: bash
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          set -euo pipefail
          last_status=""
          for attempt in $(seq 1 24); do
            status="$(curl -sS -L -o /tmp/pages.html -w '%{http_code}' --max-time 20 "$SITE_URL" || true)"
            last_status="$status"
            if [ "$status" = "200" ] && grep -q 'Kiliani' /tmp/pages.html; then
              echo "Live Pages verified: $SITE_URL"
              exit 0
            fi
            echo "Attempt $attempt: HTTP $status; waiting for Pages propagation..."
            sleep 5
          done

          echo "Pages did not serve the expected document within the verification window."
          if [ "$last_status" = "404" ]; then
            echo "The gh-pages branch was published, but the repository Pages site is not serving it."
            echo "One-time repository setting required:"
            echo "  Settings > Pages > Build and deployment > Source: Deploy from a branch"
            echo "  Branch: gh-pages / (root)"
          fi
          exit 1

      - name: Publish receipt
        shell: bash
        run: |
          {
            echo "## GitHub Pages publish receipt"
            echo
            echo "Published the validated \`docs/\` directory as the root of \`gh-pages\`."
            echo
            echo "Live URL: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          } >> "$GITHUB_STEP_SUMMARY"
